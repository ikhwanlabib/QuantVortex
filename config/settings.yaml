data:
  start_date: "2015-01-01"
  end_date: "2025-12-31"
  universe: ["AAPL", "MSFT", "GOOGL", "AMZN", "META", "NVDA", "TSLA", "JPM", "GS", "BAC", "XOM", "CVX", "JNJ", "PFE", "UNH", "SPY", "QQQ", "IWM", "TLT", "GLD"]
  benchmark: "SPY"
  cache_dir: "data/cache"

backtesting:
  initial_capital: 10000000
  commission_bps: 5
  slippage_bps: 10
  rebalance_frequency: "weekly"

risk:
  max_position_pct: 0.10
  max_sector_pct: 0.30
  max_drawdown_pct: 0.15
  var_confidence: 0.99

execution:
  market_impact_model: "square_root"
  urgency: 0.5

logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
